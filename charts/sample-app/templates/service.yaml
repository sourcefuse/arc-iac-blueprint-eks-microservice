apiVersion: v1
kind: Service
metadata:
  name: sample-app
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sample-app.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: ClusterIP
