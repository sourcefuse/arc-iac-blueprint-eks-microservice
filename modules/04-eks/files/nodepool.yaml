# EKS Auto Mode NodePool — the "what nodes may Karpenter launch" spec. Generic
# on-demand amd64 general-purpose fleet suitable for a blueprint. To make this
# the ONLY compute (true production parity, like prod's node_pools = []), set
# auto_mode_node_pools = [] in 04-eks/tfvars; otherwise it runs alongside the
# built-in general-purpose pool (harmless — Karpenter schedules onto either).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ${name_prefix}-node-pool
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: ${node_class}
      requirements:
        - key: "eks.amazonaws.com/instance-category"
          operator: In
          values: ["c", "m", "r"]
        - key: "eks.amazonaws.com/instance-cpu"
          operator: In
          values: ["2", "4", "8", "16"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand"]
  limits:
    cpu: "1000"
    memory: 1000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
