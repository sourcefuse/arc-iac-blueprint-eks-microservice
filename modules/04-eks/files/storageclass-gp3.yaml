# Default gp3 StorageClass for EKS Auto Mode. Auto Mode clusters ship NO default
# StorageClass (unlike classic EKS, which ships gp2), so PersistentVolumeClaims
# — e.g. Prometheus in 09-observability — stay Pending until this exists. Uses
# Auto Mode's built-in EBS provisioner (ebs.csi.eks.amazonaws.com), not the
# self-managed EBS CSI add-on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
